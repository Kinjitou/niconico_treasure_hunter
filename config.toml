# 埋もれた良作発掘くん — 取得条件
# ここは「候補プール」を決める設定。並び順や細かい閾値はページ上でチューニングする。

[api]
# Snapshot APIの _context と User-Agent に使う名前（40文字以内）
context = "hidden-gem-finder"

[pool]
# 投稿後この日数以内の動画を対象にする（決定事項：7日）
window_days = 7
# 動画の種別："long" / "short" / ""（空なら両方）
content_type = "long"
# 候補プールの再生数レンジ（ページ側でさらに絞り込める）
min_views = 30
max_views = 20000
# いいね数の下限（0いいね動画を除外してリクエスト数を抑える）
min_likes = 3
# 1日あたりの最大取得件数（100件単位。いいね数の多い順に取る）
per_day_max = 500
